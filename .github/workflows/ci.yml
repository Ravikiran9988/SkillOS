name: SkillOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Security Audit & Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI || secrets.COGNODB_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME || secrets.COGNODB_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || secrets.COGNODB_PASSWORD }}
      COGNODB_URI: ${{ secrets.COGNODB_URI || secrets.NEO4J_URI }}
      COGNODB_USERNAME: ${{ secrets.COGNODB_USERNAME || secrets.NEO4J_USERNAME }}
      COGNODB_PASSWORD: ${{ secrets.COGNODB_PASSWORD || secrets.NEO4J_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-key-64-bytes-long-super-secure-key-12345' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-test-jwt-refresh-secret-key-64-bytes-long-super-secure-key-67890' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      LLM_PROVIDER: groq
      PORT: 3001
      NODE_ENV: test
      VITE_API_URL: http://localhost:3001
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      EMAIL_PROVIDER: mock
      SMTP_HOST: smtppro.zoho.in
      SMTP_PORT: 587
      SMTP_USER: admin@kiranverse.tech
      SMTP_FROM: "KiranVerse <admin@kiranverse.tech>"

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install root dependencies
        run: npm ci

      - name: 4. Install client dependencies
        run: |
          cd client
          npm ci

      - name: 5. Install server dependencies
        run: |
          cd server
          npm ci

      - name: 6. Build frontend production bundle
        run: |
          cd client
          npm run build

      - name: 7. Run Server API, IDOR & Security Test Suite
        if: env.COGNODB_URI != ''
        run: |
          cd server
          npm test

      - name: 8. Install Playwright Chromium with dependencies
        run: npx playwright install --with-deps chromium

      - name: 9. Seed CognoDB database
        if: env.COGNODB_URI != ''
        run: |
          node server/scripts/seed.js

      - name: 10. Start SkillOS Backend and Frontend
        run: |
          echo "Starting backend server on port 3001..."
          node server/src/server.js &
          
          echo "Starting frontend preview on port 5173..."
          cd client && npm run preview -- --port 5173 --host &

      - name: 11. Wait for services to be available
        run: |
          echo "Waiting for backend health check..."
          npx wait-on -t 60000 http://localhost:3001/api/health
          echo "Waiting for frontend client..."
          npx wait-on -t 60000 http://localhost:5173
          echo "Services are ready!"

      - name: 12. Run Playwright Chromium & Mobile E2E Suite
        run: npm run test:e2e

      - name: 13. Upload Playwright Test Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
